<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akkodis · Page builder</title><link rel="stylesheet" href="style.css"></head><body>
<div class="editor-shell">
<header class="topbar"><div class="topbar-left"><button id="draftNav" class="icon-button" aria-label="Open drafts" title="My drafts">←</button><button id="editorNav" class="builder-name">Blog page builder</button><span class="top-divider"></span><input id="title" aria-label="Article name"><span class="draft-pill">Draft</span></div><div class="document-actions"><span id="saved">All changes saved</span><button id="saveBtn" class="text-button">Save draft</button><span class="top-divider"></span><details class="transfer-menu"><summary class="secondary">Share layout ▾</summary><div><button id="exportSkeleton">↓ Export skeleton</button><button id="importSkeleton">↑ Import skeleton</button></div></details><input id="skeletonFile" type="file" accept=".json,application/json" hidden><button id="previewBtn" class="secondary">Preview</button><button id="exportBtn" class="primary">Export HTML</button></div></header>
<main class="builder">
<aside class="block-panel"><div class="panel-tabs" role="tablist" aria-label="Editor panels"><button id="outlineTab" class="selected" role="tab" aria-selected="true">Layers</button><button id="stylesTab" role="tab" aria-selected="false">Edit block</button></div>
<div id="layersPanel"><div class="structure-heading"><h2>Page structure</h2><button id="blocksTab" class="primary">＋ New section</button></div><div id="outline"></div></div>
<div id="blockLibrary" hidden><div class="library-heading"><button id="backLayers" class="text-button">← Back to layers</button><h2>Add a section</h2><p>Choose a building block for your story.</p></div><label class="search"><span>⌕</span><input id="search" placeholder="Find a block…" aria-label="Find a block"></label><div class="block-label">CONTENT</div><div class="block-grid" id="essentialBlocks"></div><div class="block-label">MORE ELEMENTS</div><div class="block-grid" id="specialBlocks"></div></div>
<div id="editPanel" hidden><div class="panel-heading"><h2>Edit element</h2><p>Changes save as you go.</p></div><div id="settings"></div></div>
<div class="sidebar-bottom"><div class="sidebar-tools"><button id="newBtn">＋ New article</button><button id="templateNav">◫ Templates</button></div><button id="guideBtn" class="guide-link">? &nbsp; How to use the builder <span>↗</span></button><div class="sidebar-brand"><img src="assets/logos/akkodis-logo-positive.svg" alt="Akkodis"><span>CONTENT STUDIO</span></div><span id="draftCount" hidden></span><button id="helpBtn" hidden>Help</button></div></aside>
<section class="canvas-panel"><div class="canvas-toolbar"><div><span class="live-dot"></span>Article canvas <span class="canvas-hint">Click a section to select it</span></div><div class="device-switch"><button id="desktopBtn" class="selected" aria-label="Desktop preview" title="Desktop">▱</button><button id="mobileBtn" aria-label="Mobile preview" title="Mobile">▯</button></div></div><div class="canvas-scroll"><article id="canvas"></article><button id="addBlockBtn" class="add-block">＋ <span>Add a section</span></button><div class="canvas-footer"><span>Changes saved in this browser</span><span id="wordCount"></span></div></div></section>
</main></div><dialog id="modal"><div class="modal-heading"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
